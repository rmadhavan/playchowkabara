      shellsEl.appendChild(d);
      return d;
    });
  }
  function showShells(faces) {
    shellEls.forEach((el, i) => el.classList.toggle('mouth', !!faces[i]));
  }

  // 4 cowries: mouths count. 0 mouths = Baara (8), 4 mouths = Chowka (4).
  function throwShells() {
    const faces = [0, 1, 2, 3].map(() => Math.random() < 0.5 ? 1 : 0);
    const mouths = faces.reduce((a, b) => a + b, 0);
    const value = mouths === 0 ? 8 : mouths === 4 ? 4 : mouths;
    const word = mouths === 0 ? 'BAARA' : mouths === 4 ? 'CHOWKA' : 'MOVE';
    return { faces, value, word, again: mouths === 0 || mouths === 4 };
  }

  async function animateThrow() {
    Sound.sfxThrow();
    throwNum.classList.remove('show');
    const cyc = setInterval(() => showShells([0,1,2,3].map(() => Math.random() < 0.5 ? 1 : 0)), 90);
    shellEls.forEach((el, i) => {
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = `shellTumble 0.85s cubic-bezier(0.2,0.7,0.35,1) ${i * 0.06}s both`;
    });
    await sleep(1000);
    clearInterval(cyc);
    const res = throwShells();
    showShells(res.faces);
    await sleep(180);
    throwNum.querySelector('.n').textContent = res.value;
    throwNum.querySelector('.w').textContent = res.word;
    throwNum.classList.add('show');
    if (res.again) Sound.sfxAgain();
    await sleep(res.again ? 620 : 380);
    return res;
  }

  /* ---------- Pawn tokens ---------- */
  let tokens = [];   // flat list of { el, pi, ki }

  // The pawn from the mockup: a lacquered gumdrop body in the player's colour
  // with a gold-rimmed face plate holding their avatar.
  function pawnBody(color) {
    return `<svg class="pawn-body" viewBox="0 0 48 58" aria-hidden="true">
      <defs>
        <linearGradient id="pg${color.replace('#','')}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/>
          <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <ellipse cx="24" cy="53.5" rx="15" ry="3.4" fill="#1B1147" opacity=".22"/>
      <path d="M8,49 C8,23 13,10 24,10 C35,10 40,23 40,49 Q24,56 8,49 Z" fill="${color}"/>
      <path d="M8,49 C8,23 13,10 24,10 C35,10 40,23 40,49 Q24,56 8,49 Z" fill="url(#pg${color.replace('#','')})"/>
      <path d="M8,49 C8,23 13,10 24,10 C35,10 40,23 40,49 Q24,56 8,49 Z"
            fill="none" stroke="#E8B84B" stroke-width="1.7"/>
      <ellipse cx="24" cy="45.5" rx="15.2" ry="4.6" fill="#E8B84B" opacity=".55"/>
      <circle cx="24" cy="22" r="13.4" fill="#FFF6E0" stroke="#E8B84B" stroke-width="1.5"/>
    </svg>`;
  }

  // One of the four drawn friends is already a whole pawn, so it stands on its own.
  // Anything else (emoji, photo) rides inside a lacquered gumdrop body instead.
  function pawnMarkup(p) {
    if (p.avatar && p.avatar.char) {
      return `<svg class="pawn-char" viewBox="-24 -30 48 54"><use href="#${p.avatar.char}" x="-24" y="-30" width="48" height="54"/></svg>`;
    }
    return pawnBody(p.color) + `<span class="pawn-face">${avatarMarkup(p.avatar)}</span>`;
  }

  function buildTokens() {
    boardInner.querySelectorAll('.token').forEach(el => el.remove());
    tokens = [];
    state.players.forEach((p, pi) => {
      p.pawns.forEach((_, ki) => {
        const el = document.createElement('div');
        el.className = `token p${pi}`;
        el.style.setProperty('--pc', p.color);
        el.innerHTML = `<span class="ring"></span><span class="disc"></span>` +
                       `<span class="token-inner">${pawnMarkup(p)}</span>` +
                       `<span class="pick-arrow">👇</span>`;
        el.addEventListener('click', () => onTokenClick(pi, ki));
        boardInner.appendChild(el);
        tokens.push({ el, pi, ki });
      });
    });
  }
  function tokenOf(pi, ki) { return tokens.find(t => t.pi === pi && t.ki === ki); }
  function innerOf(pi, ki) { return tokenOf(pi, ki).el.querySelector('.token-inner'); }

  const SHARE = {
    1: [[0, 1.2]],
    2: [[-3.4, -0.6], [3.4, 2.6]],
    3: [[0, -2.4], [-3.9, 3.4], [3.9, 3.4]],
    4: [[-3.4, -2.2], [3.4, -2.2], [-3.4, 4.2], [3.4, 4.2]],
    5: [[0, -3.4], [-4.3, 0.2], [4.3, 0.2], [-2.6, 4.8], [2.6, 4.8]],
    6: [[-3.4, -3.8], [3.4, -3.8], [-4.7, 0.6], [4.7, 0.6], [-3.4, 4.8], [3.4, 4.8]],
  };

  function layoutTokens() {
    const groups = {};
    state.players.forEach((p, pi) => {
      p.pawns.forEach((step, ki) => {
        const k = key(p.path[step]);
        (groups[k] = groups[k] || []).push({ pi, ki });
      });
    });
    Object.entries(groups).forEach(([k, list]) => {
      const [c, r] = k.split(',').map(Number);
      const { x, y } = cc([c, r]);
      const offs = SHARE[Math.min(list.length, 6)] || SHARE[6];
      list.forEach((t, j) => {
        const [dx, dy] = offs[j % offs.length];
        const el = tokenOf(t.pi, t.ki).el;
        el.style.left = (x + dx) + '%';
        el.style.top = (y + dy) + '%';
      });
    });
  }

  // A pawn tips slightly toward where it is heading — cheaper and cuter than
  // drawing four facings, and it keeps every face pointed at the player.
  function applyLeans() {
    state.players.forEach((p, pi) => {
      p.pawns.forEach((step, ki) => {
        const t = tokenOf(pi, ki);
        if (!t) return;
        let lean = 0;
        if (step < LAST) {
          const a = cc(p.path[step]), b = cc(p.path[step + 1]);
          lean = Math.abs(b.x - a.x) > Math.abs(b.y - a.y)
            ? (b.x > a.x ? 8 : -8)
            : (b.y > a.y ? -6 : 6);
        }
        t.el.style.setProperty('--lean', lean + 'deg');
      });
    });
  }

  function playAnim(el, anim) {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = anim;
  }
  function setIdle(pi, ki) { innerOf(pi, ki).style.animation = ''; }

  function shout(text, bg, cell) {
    const el = document.createElement('div');
    el.className = 'shout';
    el.textContent = text;
    el.style.background = bg;
    if (cell) {
      const { x, y } = cc(cell);
      el.style.left = x + '%';
      el.style.top = y + '%';
    }
    boardInner.appendChild(el);
    setTimeout(() => el.remove(), 1150);
  }

  /* ---------- Rules ---------- */
  function gattiMembers(pi, ki) {
    const p = state.players[pi];
    const step = p.pawns[ki];
    if (step <= 0 || step >= LAST) return [ki];
    const members = p.pawns.map((pawnStep, index) => pawnStep === step ? index : -1).filter(index => index >= 0);
    return members.length === 2 ? members : [ki];
  }

  function moveDistance(pi, ki, roll) {
    return gattiMembers(pi, ki).length === 2 ? (roll % 2 === 0 ? roll / 2 : 0) : roll;
  }

  function selectionUnit(pi, ki) {
    return gattiMembers(pi, ki);
  }

  function legalMoves(pi, roll) {
    const p = state.players[pi];
    const out = [];
    p.pawns.forEach((step, ki) => {
      if (step >= LAST) return;              // already at the lotus
      const members = gattiMembers(pi, ki);
      if (members[0] !== ki) return;          // a gatti is one move, not two choices
      const distance = moveDistance(pi, ki, roll);
      if (distance && step + distance <= LAST) out.push(ki);  // must land exactly
    });
    return out;
  }

  function captureAt(pi, cell) {
    if (SAFE.has(key(cell))) return [];
    const hits = [];
    state.players.forEach((op, oi) => {
      if (oi === pi) return;
      op.pawns.forEach((step, ki) => {
        if (step > 0 && step < LAST && key(op.path[step]) === key(cell)) hits.push({ oi, ki });
      });
    });
    return hits;
  }

  /* ---------- Movement ---------- */
  async function movePawn(pi, ki, roll) {
    const p = state.players[pi];
    const from = p.pawns[ki];
    const members = gattiMembers(pi, ki);
    const distance = moveDistance(pi, ki, roll);
    const movingTokens = members.map(member => tokenOf(pi, member));
    movingTokens.forEach(tok => tok.el.classList.add('selected'));

    for (let s = from + 1; s <= from + distance; s++) {
      members.forEach(member => { p.pawns[member] = s; });
      layoutTokens();
      applyLeans();
      members.forEach(member => playAnim(innerOf(pi, member), 'hopAnim 0.22s ease'));
      Sound.sfxHop();
      await sleep(215);
    }
    members.forEach(member => setIdle(pi, member));

    const landed = p.path[p.pawns[ki]];

    if (p.pawns[ki] === LAST) {
      Sound.sfxHome();
      shout('HOME! 🪷', 'linear-gradient(135deg,#F59E0B,#FDE047)', landed);
      movingTokens.forEach(tok => tok.el.classList.remove('selected'));
      members.forEach(member => playAnim(innerOf(pi, member), 'bloom 0.8s ease forwards'));
      await sleep(760);
      movingTokens.forEach(tok => { tok.el.style.display = 'none'; });
      p.done += members.length;
      renderStrip();
      fireworkShow(2, 110, 260, screenPos(CENTRE));
      await sleep(300);
      return;
    }

    Sound.sfxLand();

    const hits = captureAt(pi, landed);
    if (hits.length) {
      Sound.sfxBoop();
      shout('BOOP!', 'linear-gradient(135deg,#F43F8A,#FB7185)', landed);
      for (const h of hits) {
        const ht = tokenOf(h.oi, h.ki);
        playAnim(ht.el.querySelector('.token-inner'), 'boopAway 0.6s ease forwards');
      }
      await sleep(620);
      for (const h of hits) {
        state.players[h.oi].pawns[h.ki] = 0;
        const inner = tokenOf(h.oi, h.ki).el.querySelector('.token-inner');
        layoutTokens();
        applyLeans();
        playAnim(inner, 'landPop 0.42s var(--bounce) forwards');
      }
      await sleep(440);
      hits.forEach(h => setIdle(h.oi, h.ki));
    } else if (SAFE.has(key(landed))) {
      Sound.sfxSafe();
    }

    movingTokens.forEach(tok => tok.el.classList.remove('selected'));
    await sleep(120);
  }

  /* ---------- Turn flow ---------- */
  function isComputer(pi) { const p = state.players[pi]; return !!p && p.cpu; }
  function setTrayEnabled(on) { shellTray.classList.toggle('disabled', !on); }
  function setHint(t) { trayHint.innerHTML = t; }

  function renderStrip() {
    playerStrip.innerHTML = state.players.map((p, i) => `
      <div class="p-row ${i === state.current && state.started && !state.over ? 'turn' : ''}" style="--pc:${p.color}">
        <span class="p-face">${avatarMarkup(p.avatar)}</span>
        <span class="p-name">${p.name}</span>
        <span class="p-turn">TURN</span>
        <span class="p-pips">${[0,1,2,3].map(n => `<i class="${n < p.done ? 'on' : ''}"></i>`).join('')}</span>
      </div>`).join('');
  }

  function clearMovable() {
    tokens.forEach(t => t.el.classList.remove('movable', 'selected'));
    state.movable = [];
  }

  function highlightMovable() {
    clearMovable();
    state.movable = legalMoves(state.current, state.roll);
    state.sel = 0;
    state.movable.forEach(ki => {
      selectionUnit(state.current, ki).forEach(member => tokenOf(state.current, member).el.classList.add('movable'));
    });
    updateSelection();
  }

  function updateSelection() {
    tokens.forEach(t => t.el.classList.remove('selected'));
    if (state.phase !== 'choose' || !state.movable.length) return;
    const ki = state.movable[state.sel % state.movable.length];
    selectionUnit(state.current, ki).forEach(member => tokenOf(state.current, member).el.classList.add('selected'));
  }

  function cycleSelection(dir) {
    if (state.phase !== 'choose' || state.movable.length < 2) return;
    state.sel = (state.sel + dir + state.movable.length) % state.movable.length;
    Sound.sfxHop();
    updateSelection();
  }

  function onTokenClick(pi, ki) {
    if (state.phase !== 'choose' || pi !== state.current) return;
    if (isComputer(state.current)) return;
    const move = state.movable.find(moveIndex => selectionUnit(pi, moveIndex).includes(ki));
    if (move === undefined) return;
    state.sel = state.movable.indexOf(move);
    commitMove(move);
  }

  function confirmSelection() {
    if (state.phase !== 'choose' || !state.movable.length) return;
    commitMove(state.movable[state.sel % state.movable.length]);
  }

  async function commitMove(ki) {
    if (state.phase !== 'choose') return;
    state.phase = 'moving';
    clearMovable();
    setHint('');
    const pi = state.current;
    const roll = state.roll;

    await movePawn(pi, ki, roll);

    const p = state.players[pi];
    if (p.done >= 4) { finish(pi); return; }

    if (state.againPending) {
      state.againPending = false;
      state.phase = 'idle';
      if (isComputer(pi)) scheduleComputer();
      else { setTrayEnabled(true); shellTray.classList.add('again'); setHint('<span class="tapper">✨ Throw again!</span>'); }
      return;
    }

    nextPlayer();
  }

  function nextPlayer() {
    shellTray.classList.remove('again');
    state.current = (state.current + 1) % state.players.length;
    startTurn();
  }

  function startTurn() {
    state.phase = 'idle';
    state.roll = 0;
    clearMovable();
    renderStrip();
    drawTurnMarks();
    throwNum.classList.remove('show');
    if (!state.started) {
      setTrayEnabled(true);
      setHint('<span class="tapper">👆 Tap the shells to start</span>');
      return;
    }
    if (isComputer(state.current)) {
      setTrayEnabled(false);
      setHint('🤖 thinking…');
      scheduleComputer();
    } else {
      setTrayEnabled(true);
      setHint('<span class="tapper">👆 Tap to throw</span>');
    }
  }

  async function doThrow() {
    if (state.phase !== 'idle' || state.over) return;
    state.phase = 'rolling';
    setTrayEnabled(false);
    shellTray.classList.remove('again');
    setHint('');

    const res = await animateThrow();
    state.roll = res.value;
    state.againPending = res.again;

    if (res.again) {
      shout(res.word + '!', 'linear-gradient(135deg,#7E22CE,#A855F7)', null);
    }

    const moves = legalMoves(state.current, state.roll);
    if (!moves.length) {
      Sound.sfxNope();
      setHint('No moves 😅');
      await sleep(1100);
      if (state.againPending) {
        state.againPending = false;
        state.phase = 'idle';
        if (isComputer(state.current)) scheduleComputer();
        else { setTrayEnabled(true); shellTray.classList.add('again'); setHint('<span class="tapper">✨ Throw again!</span>'); }
      } else {
        nextPlayer();
      }
      return;
    }

    state.phase = 'choose';
    highlightMovable();

    if (isComputer(state.current)) {
      setHint('🤖 choosing…');
      await sleep(650);
      commitMove(pickComputerMove(state.current, state.roll, moves));
      return;
    }

    if (moves.length === 1) {
      setHint('Off we go!');
      await sleep(520);
      if (state.phase === 'choose') commitMove(moves[0]);
      return;
    }
    setHint('<span class="tapper">👆 Pick a friend</span>');
  }

  // Prefer a capture, then getting a pawn home, then the pawn furthest along.
  function pickComputerMove(pi, roll, moves) {
    const p = state.players[pi];
    let best = moves[0], bestScore = -Infinity;
    moves.forEach(ki => {
      const dest = p.pawns[ki] + moveDistance(pi, ki, roll);
      const cell = p.path[dest];
      let score = dest;
      if (dest === LAST) score += 100;
      if (captureAt(pi, cell).length) score += 60;
      if (SAFE.has(key(cell))) score += 12;
      if (score > bestScore) { bestScore = score; best = ki; }
    });
    return best;
  }

  function scheduleComputer() {
    setTimeout(() => { if (!state.over && state.phase === 'idle') doThrow(); }, 700);
  }

  /* ---------- Fireworks ---------- */
  const FW_COLORS = ['#FFD54F', '#F5A623', '#C2185B', '#00897B', '#7B1FA2', '#38BDF8', '#FFF3D6', '#F43F8A'];

  function burst(x, y, sparks, spread) {
    const flash = document.createElement('div');
    flash.className = 'fw-flash';
    flash.style.left = x + 'px';
    flash.style.top = y + 'px';
    document.body.appendChild(flash);
    flash.animate(
      [{ transform: 'translate(-50%,-50%) scale(0.2)', opacity: 0.9 },
       { transform: 'translate(-50%,-50%) scale(1.7)', opacity: 0 }],
      { duration: 420, easing: 'ease-out', fill: 'forwards' });
    setTimeout(() => flash.remove(), 460);

    for (let i = 0; i < sparks; i++) {
      const a = (i / sparks) * Math.PI * 2 + Math.random() * 0.35;
      const d = spread * (0.5 + Math.random() * 0.7);
      const dx = Math.cos(a) * d, dy = Math.sin(a) * d;
      const dur = 750 + Math.random() * 550;
      const el = document.createElement('div');
      el.className = 'fw-spark';
      const col = FW_COLORS[(Math.random() * FW_COLORS.length) | 0];
      el.style.background = col;
      el.style.boxShadow = `0 0 9px ${col}`;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);
      el.animate(
        [{ transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
         { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy * 0.8}px)) scale(0.85)`, opacity: 1, offset: 0.55 },
         { transform: `translate(calc(-50% + ${dx * 1.15}px), calc(-50% + ${dy + 110}px)) scale(0.25)`, opacity: 0 }],
        { duration: dur, easing: 'cubic-bezier(0.12,0.7,0.35,1)', fill: 'forwards' });
      setTimeout(() => el.remove(), dur + 60);
    }
  }

  // Where a board cell sits on screen, so a burst can be centred on the lotus.
  function screenPos(cell) {
    const r = boardInner.getBoundingClientRect();
    const { x, y } = cc(cell);
    return { x: r.left + (x / 100) * r.width, y: r.top + (y / 100) * r.height };
  }

  function fireworkShow(shots, spread, gap, origin) {
    for (let i = 0; i < shots; i++) {
      setTimeout(() => {
        const p = origin
          ? { x: origin.x + (Math.random() - 0.5) * 90, y: origin.y + (Math.random() - 0.5) * 90 }
          : { x: window.innerWidth * (0.15 + Math.random() * 0.7),
              y: window.innerHeight * (0.12 + Math.random() * 0.45) };
        burst(p.x, p.y, 14 + Math.floor(Math.random() * 10), spread);
      }, i * gap);
    }
  }

  function finish(pi) {
    state.over = true;
    state.phase = 'idle';
    setTrayEnabled(false);
    shellTray.classList.remove('again');
    setHint('');
    clearMovable();
    drawTurnMarks();
    renderStrip();
    const winner = state.players[pi];
    Sound.sfxWin();
    fireworkShow(14, 210, 230);

    resultAvatars.innerHTML = state.players
      .map((p, i) => `<span class="${i === pi ? 'winner' : ''}"${i === pi ? '' : ' style="opacity:.4"'}>${avatarMarkup(p.avatar)}</span>`)
      .join(' ');
    if (winner.cpu) {
      resultTitle.textContent = 'Computer wins!';
      resultSub.textContent = 'So close — try again! 🤖';
    } else if (state.mode === '1p') {
      resultTitle.textContent = 'You won! 🎉';
      resultSub.textContent = 'All four friends made it to the lotus!';
    } else {
      resultTitle.textContent = `${winner.name} wins! 🎉`;
      resultSub.textContent = 'Great game — play again?';
    }
    setTimeout(() => resultBackdrop.classList.remove('hidden'), 800);
  }

  /* ---------- Players ---------- */
  function buildPlayers() {
    let list;
    if (state.mode === '1p') {
      const me = AVATAR_BY_ID[state.avatarIds[0]] || AVATAR_SET[0];
      list = [
        { name: 'You', avatar: me, color: me.color, cpu: false },
        { name: 'Computer', avatar: ROBOT, color: ROBOT.color, cpu: true },
      ];
    } else {
      list = [];
      for (let i = 0; i < state.playerCount; i++) {
        const a = AVATAR_BY_ID[state.avatarIds[i]] || AVATAR_SET[i % AVATAR_SET.length];
        list.push({ name: `Player ${i + 1}`, avatar: a, color: a.color, cpu: false });
      }
    }
    list.forEach((p, i) => {
      p.home = HOME_IDX[i];
      p.path = pathFor(p.home);
      p.pawns = [0, 0, 0, 0];
      p.done = 0;
    });
    state.players = list;
  }

  /* ---------- Icon picker ---------- */
  function humanLabel(i) { return state.mode === '1p' ? 'You' : `P${i + 1}`; }

  function buildIconChips() {
    iconChips.innerHTML = '';
    state.players.forEach((p, i) => {
      if (p.cpu) return;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'icon-chip';
      btn.style.setProperty('--pc', p.color);
      btn.innerHTML = `<span class="ic-face">${avatarMarkup(p.avatar)}</span><span class="ic-label">${humanLabel(i)}</span>`;
      btn.addEventListener('click', () => openPicker(i));
      iconChips.appendChild(btn);
    });
  }

  let pickerIndex = 0;
  function buildAvatarGrid() {
    avatarGrid.innerHTML = AVATAR_SET.map(a =>
      `<button type="button" class="avatar-opt" data-id="${a.id}" style="--pc:${a.color}" aria-label="${a.label}">${avatarMarkup(a)}</button>`
    ).join('');
    avatarGrid.querySelectorAll('.avatar-opt').forEach(btn =>
      btn.addEventListener('click', () => chooseAvatar(btn.dataset.id)));
  }
  function openPicker(i) {
    pickerIndex = i;
    pickerTitle.textContent = state.mode === '1p' ? 'Pick your icon' : `Player ${i + 1}’s icon`;
    avatarGrid.querySelectorAll('.avatar-opt').forEach(b =>
      b.classList.toggle('selected', b.dataset.id === state.avatarIds[i]));
    pickerBackdrop.classList.remove('hidden');
  }
  function chooseAvatar(id) {
    state.avatarIds[pickerIndex] = id;
    saveAvatars();
    pickerBackdrop.classList.add('hidden');
    resetGame();
  }

  /* ---------- Reset ---------- */
  function resetGame() {
    state.current = 0;
    state.started = false;
    state.over = false;
    state.phase = 'idle';
    state.roll = 0;
    state.againPending = false;
    buildPlayers();
    buildBoard();
    buildTokens();
    buildIconChips();
    tokens.forEach(t => { t.el.style.display = ''; t.el.style.transition = 'none'; });
    layoutTokens();
    applyLeans();
    void boardInner.offsetWidth;
    tokens.forEach(t => t.el.style.transition = '');
    showShells([1, 1, 0, 0]);
    throwNum.classList.remove('show');
    shellTray.classList.remove('again');
    controls.classList.remove('locked');
    resultBackdrop.classList.add('hidden');
    renderStrip();
    drawTurnMarks();
    startTurn();
  }

  /* ---------- Backdrop: a festival courtyard ---------- */
  function buildFestival() {
    const garden = $('#garden');
    const rand = (a, b) => a + Math.random() * (b - a);
    const frag = document.createDocumentFragment();

    ['left', 'right'].forEach(side => {
      const toran = document.createElement('div');
      toran.className = 'toran ' + side;
      for (let i = 0; i < 7; i++) {
        const leaf = document.createElement('i');
        leaf.style.height = rand(16, 34).toFixed(0) + 'px';
        leaf.style.animationDelay = (-rand(0, 3)).toFixed(2) + 's';
        toran.appendChild(leaf);
      }
      frag.appendChild(toran);
    });

    // Bells hang beside each toran, at staggered drops, clear of the controls.
    [[3, 30], [8.5, 54], [14, 36], [86, 36], [91.5, 56], [97, 28]].forEach(([left, drop], i) => {
      const bell = document.createElement('div');
      bell.className = 'bell';
      bell.style.left = left + '%';
      bell.style.setProperty('--drop', drop + 'px');
      bell.style.setProperty('--dur', (3.0 + (i % 3) * 0.6).toFixed(1) + 's');
      bell.style.setProperty('--delay', (-i * 0.45).toFixed(2) + 's');
      bell.innerHTML = '<span class="cord"></span><span class="clapper">🔔</span>';
      frag.appendChild(bell);
    });

    const makeDiya = (scale) => {
      const diya = document.createElement('div');
      diya.className = 'diya';
      diya.style.transform = `scale(${scale})`;
      diya.innerHTML = '<span class="glow"></span><span class="flame"></span><span class="bowl"></span>';
      diya.querySelector('.flame').style.animationDelay = (-rand(0, 1.5)).toFixed(2) + 's';
      diya.querySelector('.glow').style.animationDelay = (-rand(0, 2.6)).toFixed(2) + 's';
      return diya;
    };

    // Lamps line both side walls at an even rhythm.
    [4, 92].forEach(left => {
      for (let i = 0; i < 4; i++) {
        const diya = makeDiya(0.85);
        diya.style.left = left + '%';
        diya.style.top = (30 + i * 16) + '%';
        frag.appendChild(diya);
      }
    });

    // Slow wheels sit low on the side walls, well clear of the top.
    [[2, 52], [88, 46]].forEach(([left, top], i) => {
      const wheel = document.createElement('div');
      wheel.className = 'rangoli';
      wheel.style.width = wheel.style.height = '132px';
      wheel.style.left = left + '%';
      wheel.style.top = top + '%';
      wheel.style.setProperty('--dur', (48 + i * 14) + 's');
      if (i) wheel.style.animationDirection = 'reverse';
      frag.appendChild(wheel);
    });

    const ground = document.createElement('div');
    ground.className = 'ground';
    frag.appendChild(ground);

    // A planted border: even spacing, alternating height and size.
    const bloom = ['🌼','🏵️','🌸','🌺','🪷'];
    const count = 15;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('span');
      el.className = 'deco flower';
      el.textContent = bloom[i % bloom.length];
      el.style.left = (3 + i * (94 / (count - 1))).toFixed(2) + '%';
      el.style.bottom = (i % 2 ? 46 : 14) + 'px';
      el.style.fontSize = i % 2 ? 'clamp(17px, 3vw, 28px)' : 'clamp(21px, 3.9vw, 36px)';
      el.style.setProperty('--dur', (3.4 + (i % 4) * 0.45).toFixed(2) + 's');
      el.style.setProperty('--delay', (-i * 0.3).toFixed(2) + 's');
      frag.appendChild(el);
    }

    // Lamps set between the plants along the ground.
    for (let i = 0; i < 5; i++) {
      const diya = makeDiya(0.95);
      diya.style.left = (10 + i * 19).toFixed(1) + '%';
      diya.style.bottom = '6px';
      frag.appendChild(diya);
    }

    [12, 47, 83].forEach((left, i) => {
      const bird = document.createElement('span');
      bird.className = 'peacock';
      bird.textContent = '🦚';
      bird.style.left = left + '%';
      bird.style.bottom = (i === 1 ? 34 : 22) + 'px';
      bird.style.setProperty('--dur', (3.2 + i * 0.6).toFixed(1) + 's');
      bird.style.setProperty('--delay', (-i * 0.8).toFixed(1) + 's');
      frag.appendChild(bird);
    });

    garden.appendChild(frag);
  }

  /* ---------- Wire up ---------- */
  function wireSeg(segEl, defaultValue, onChange) {
    const btns = segEl.querySelectorAll('.seg-btn');
    const select = (val) => {
      btns.forEach(b => {
        const active = b.dataset.value === val;
        b.classList.toggle('selected', active);
        b.setAttribute('aria-checked', active ? 'true' : 'false');
      });
      segEl.dataset.value = val;
      if (onChange) onChange(val);
    };
    btns.forEach(b => b.addEventListener('click', () => { Sound.init(); select(b.dataset.value); }));
    select(defaultValue);
  }

  function isModalOpen() {
    return !resultBackdrop.classList.contains('hidden')
      || !confirmBackdrop.classList.contains('hidden')
      || !pickerBackdrop.classList.contains('hidden');
  }

  // Any panel that should swallow a "tap to start".
  function anyOverlayOpen() {
    return isModalOpen()
      || !!document.querySelector('.music-picker-backdrop:not(.hidden), .fz-info-backdrop:not(.hidden)');
  }

  buildFestival();
  buildShells();
  buildAvatarGrid();

  wireSeg(modeSeg, '1p', (val) => {
    state.mode = val;
    countRow.classList.toggle('hidden', val !== '2p');
    resetGame();
  });
  wireSeg(countSeg, '2', (val) => { state.playerCount = +val; resetGame(); });

  async function enterGameplay() {
    if (state.started) return;
    Sound.init();
    state.started = true;
    controls.classList.add('locked');
    document.body.classList.add('playing');
    drawTurnMarks();
    renderStrip();
    startTurn();
  }

  // No Play button: a tap anywhere on the setup screen (or space/enter/tab) begins the game.
  document.addEventListener('pointerdown', (e) => {
    if (state.started || anyOverlayOpen()) return;
    if (e.target instanceof Element && e.target.closest('.controls, .topbar')) return;
    enterGameplay();
  });
  window.addEventListener('keydown', (e) => {
    if (state.started || anyOverlayOpen()) return;
    if (e.key !== ' ' && e.key !== 'Enter' && e.key !== 'Tab') return;
    if (e.key !== 'Tab') e.preventDefault();
    enterGameplay();
  });

  const onTray = () => {
    Sound.init();
    if (anyOverlayOpen() || state.over) return;
    if (!state.started) { enterGameplay(); return; }
    if (isComputer(state.current)) return;
    if (shellTray.classList.contains('disabled')) return;
    doThrow();
  };
  shellTray.addEventListener('click', onTray);
  shellTray.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onTray(); }
  });

  window.addEventListener('keydown', (e) => {
    if (isModalOpen() || !state.started || state.over) return;
    const a = document.activeElement;
    const inWidget = a && (a.tagName === 'BUTTON' || a.tagName === 'A' || a.getAttribute('role') === 'radio');
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); cycleSelection(-1); return; }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); cycleSelection(1); return; }
    if (e.key !== ' ' && e.key !== 'Enter') return;
    if (inWidget && a !== shellTray) return;
    e.preventDefault();
    if (isComputer(state.current)) return;
    if (state.phase === 'choose') confirmSelection();
    else if (state.phase === 'idle') onTray();
  });

  let confirmAction = null;
  function askConfirm(action) { confirmAction = action; confirmBackdrop.classList.remove('hidden'); }
  function exitToSettings() { document.body.classList.remove('playing'); resetGame(); }

  restartBtn.addEventListener('click', () => {
    Sound.init();
    if (state.started && !state.over) askConfirm(resetGame);
    else resetGame();
  });
  closeBtn.addEventListener('click', () => {
    Sound.init();
    if (state.started && !state.over) askConfirm(exitToSettings);
    else exitToSettings();
  });
  confirmYesBtn.addEventListener('click', () => {
    confirmBackdrop.classList.add('hidden');
    const a = confirmAction; confirmAction = null;
    if (a) a();
  });
  confirmNoBtn.addEventListener('click', () => { confirmBackdrop.classList.add('hidden'); confirmAction = null; });
  pickerCloseBtn.addEventListener('click', () => { pickerBackdrop.classList.add('hidden'); });
  pickerBackdrop.addEventListener('click', (e) => { if (e.target === pickerBackdrop) pickerBackdrop.classList.add('hidden'); });
  playAgainBtn.addEventListener('click', () => {
    resultBackdrop.classList.add('hidden');
    resetGame();
    enterGameplay();
  });
  homeBtn.addEventListener('click', () => {
    resultBackdrop.classList.add('hidden');
    resetGame();
  });

  soundBtn.addEventListener('click', () => {
    FunZoneMusic.openPicker();
  });

  resetGame();
  </script>
</body>
